name: CI

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests
      - run: python -m compileall -q backend/app
      - run: python -m py_compile apps/bot/bot.py backend/scripts/generate_telegram_session.py backend/scripts/generate_integration_key.py
      - name: Verify database migrations
        run: cd backend && DATABASE_URL=sqlite:///./migration-test.db alembic upgrade head && DATABASE_URL=sqlite:///./migration-test.db alembic downgrade base
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  cloudflare-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare-api/package.json
      - run: npm install
      - run: npm run typecheck
